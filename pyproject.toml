[project]
name = "fire-analyzer"
version = "0.1.0"
requires-python = "~=3.12.0"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
    "ultralytics>=8.3.0",
    "torch>=2.2.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.3.0",
    "google-genai>=1.0.0",
]

[tool.vercel]
entrypoint = "app.api:app"
